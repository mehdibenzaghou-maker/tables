<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Plan de Salle — Réservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f3;
    --grid:#e6e1d4;
    --ink:#2a2822;
    --wall:#3a362c;
    --gold:#b8935a;
    --table-fill:#f2dfa0;
    --table-fill-hover:#ecd383;
    --table-border:#8a6d3b;
    --reserved:#b03a2e;
    --reserved-border:#7a2620;
    --paper-panel:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:20px;
    min-height:100vh;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
    border-bottom:2px solid var(--wall);
    padding-bottom:14px;
  }
  .header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:-0.5px;
  }
  .header .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#8a8672;
  }
  .toolbar{display:flex;gap:10px;align-items:center;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1.5px solid var(--wall);
    background:var(--paper-panel);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:var(--wall);color:var(--paper);}
  .btn.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.danger{border-color:var(--reserved);color:var(--reserved);}
  .btn.danger:hover{background:var(--reserved);color:#fff;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.5px;
    padding:10px 18px;
    background:var(--paper-panel);
    border:1.5px solid var(--grid);
    border-bottom:none;
    cursor:pointer;
    color:#8a8672;
    position:relative;
    top:1px;
  }
  .tab.active{
    color:var(--ink);
    border-color:var(--wall);
    background:var(--paper-panel);
    font-weight:700;
  }
  .tab .cap{display:block;font-size:10px;color:#a89f7f;margin-top:2px;}

  .room-meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#8a8672;
    margin-bottom:10px;
    display:flex;
    gap:18px;
  }
  .room-meta b{color:var(--ink);}

  .plan-wrap{
    background:var(--paper-panel);
    border:1.5px solid var(--wall);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 2px 0 var(--grid);
  }
  .plan{
    position:relative;
    width:100%;
    background-image:
      linear-gradient(#f0ede2 1px, transparent 1px),
      linear-gradient(90deg, #f0ede2 1px, transparent 1px);
    background-size:5% 5%;
  }
  .room-label{
    position:absolute;
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:#b0a888;
    letter-spacing:1px;
    padding:6px 8px;
    pointer-events:none;
  }

  .table{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--table-fill);
    border:1.5px solid var(--table-border);
    color:var(--ink);
    font-family:'Space Mono',monospace;
    font-size:9px;
    font-weight:700;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:background .12s, box-shadow .12s;
    line-height:1.2;
    padding:2px;
  }
  .table:hover{background:var(--table-fill-hover);}
  .table.circle{border-radius:50%;}
  .table.rect{border-radius:5px;}
  .table.diamond .inner{transform:rotate(-45deg);}
  .table.diamond{border-radius:5px;}
  .table.has-chairs.circle::before{
    content:"";position:absolute;inset:-16%;
    border:1.5px dashed var(--table-border);border-radius:50%;pointer-events:none;
  }
  .table.has-chairs.diamond::before{
    content:"";position:absolute;inset:-18%;
    border:1.5px dashed var(--table-border);border-radius:8px;pointer-events:none;
  }
  .table.has-chairs.rect::before{
    content:"";position:absolute;inset:-12% -7%;
    border:1.5px dashed var(--table-border);border-radius:9px;pointer-events:none;
  }
  .table.reserved.has-chairs::before{border-color:var(--reserved-border);}
  .hub{
    position:absolute;
    background:repeating-linear-gradient(45deg, var(--wall), var(--wall) 2px, transparent 2px, transparent 7px);
    border:1px solid var(--wall);
    transform:rotate(45deg);
    pointer-events:none;
    opacity:0.65;
  }
  .table.reserved{
    background:var(--reserved);
    border-color:var(--reserved-border);
    color:#fff;
  }
  .table.dragging{
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:50;
    opacity:0.9;
  }
  .edit-mode .table{cursor:grab;}
  .edit-mode .table.dragging{cursor:grabbing;}
  .table .name-tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:9px;
    margin-top:2px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .legend{
    display:flex;gap:18px;margin-top:12px;
    font-family:'Space Mono',monospace;font-size:11px;color:#8a8672;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(30,28,22,0.55);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-panel);
    border:1.5px solid var(--wall);
    border-radius:4px;
    padding:22px 24px;
    width:300px;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
  }
  .modal h3{
    margin:0 0 4px;
    font-family:'Fraunces',serif;
    font-size:19px;
  }
  .modal .meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#8a8672;
    margin-bottom:14px;
  }
  .modal input{
    width:100%;
    padding:9px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    border:1.5px solid var(--grid);
    border-radius:3px;
    margin-bottom:12px;
  }
  .modal .row{display:flex;gap:8px;}
  .modal .row .btn{flex:1;text-align:center;}
  .modal .close{
    position:absolute;top:14px;right:16px;cursor:pointer;
    font-size:16px;color:#8a8672;background:none;border:none;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--wall);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:12px;
    padding:10px 18px;border-radius:4px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;}

  /* Login gate */
  .login-screen{
    position:fixed;inset:0;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    z-index:500;padding:20px;
  }
  .login-box{
    background:var(--paper-panel);border:1.5px solid var(--wall);
    border-radius:4px;padding:28px 26px;width:100%;max-width:320px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
  }
  .login-box h2{font-family:'Fraunces',serif;margin:0 0 4px;font-size:22px;}
  .login-box .sub{font-family:'Space Mono',monospace;font-size:11px;color:#8a8672;margin-bottom:18px;}
  .login-box input{
    width:100%;padding:11px 12px;font-family:'Inter',sans-serif;font-size:15px;
    border:1.5px solid var(--grid);border-radius:3px;margin-bottom:10px;
  }
  .login-box .btn{width:100%;margin-top:6px;padding:12px;font-size:14px;}
  .login-error{color:var(--reserved);font-family:'Space Mono',monospace;font-size:11px;min-height:14px;margin-top:4px;}

  /* Mobile */
  @media (max-width: 720px){
    body{padding:12px;}
    .header{flex-direction:column;align-items:flex-start;gap:10px;}
    .header h1{font-size:22px;}
    .toolbar{width:100%;}
    .toolbar .btn{flex:1;font-size:12px;padding:11px 8px;}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .tab{flex:0 0 auto;padding:10px 14px;font-size:11px;}
    .room-meta{flex-direction:column;gap:2px;}
    .legend{flex-wrap:wrap;gap:10px;font-size:10px;}
    .legend span:last-child{width:100%;margin-left:0;order:99;}
    .table{font-size:8px;}
    .table .name-tag{font-size:8px;}
    .modal{width:calc(100vw - 40px);max-width:340px;}
    .modal .row{flex-direction:column;}
    .modal .row .btn{padding:13px;}
  }
  @media (max-width: 420px){
    .header h1{font-size:19px;}
    .toolbar .btn{font-size:11px;padding:10px 6px;}
  }
</style>
</head>
<body>

<div id="app">

<div class="header">
  <div>
    <h1>Plan de Salle</h1>
    <div class="sub" id="loadStatus">chargement…</div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="room-meta" id="roomMeta"></div>

<div class="plan-wrap">
  <div class="plan" id="plan"></div>
</div>

<div class="legend">
  <span><i class="swatch" style="background:var(--table-fill);border:1px solid var(--table-border)"></i>Libre</span>
  <span><i class="swatch" style="background:var(--reserved)"></i>Réservée</span>
  <span style="margin-left:auto;">Cliquez une table pour réserver / libérer · Mode édition pour déplacer</span>
</div>

<div class="toast" id="toast"></div>

</div><!-- /#app -->

<script>

      {id:"S2-09",shape:"rect",cap:"2p",x:10,y:6,w:6,h:12},

  },
  vip: {
    name:"Salle VIP", sub:"Cabinet Privé · 12 couverts", ratio: 347/396,
    tables:[
      {id:"VIP-01",shape:"rect",cap:"8-12p",x:52,y:14,w:38,h:44},
      {id:"VIP-02",shape:"rect",cap:"lounge",x:5,y:30,w:22,h:30},

      {id:"BAL-13",shape:"circle",cap:"2p",x:87,y:83,w:6,h:12},
      {id:"BAL-14",shape:"rect",cap:"15p",x:41,y:70,w:37,h:16,label:"BAR PRINCIPAL (15p)"},
    ]
  }
};

const ROOM_ORDER = ["salle1","salle2","vip","balcon"];
const NO_CHAIRS = new Set(["S1-BAR","BAL-14","VIP-02"]);
let state = {}; // room -> {tableId: {x,y,status,name}}
let currentRoom = "salle1";
let editMode = false;
let activeTableId = null;
let dragging = null;

const STORAGE_KEY = "floorplan-state-v1";

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    state = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }
  document.getElementById('loadStatus').textContent = "données partagées — synchronisées";
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  }catch(e){
    toast("Erreur de sauvegarde");
  }
}

function getTableState(room, id){
  if(!state[room]) state[room] = {};
  return state[room][id] || {status:"free", name:""};
}
function setTableState(room, id, patch){
  if(!state[room]) state[room] = {};
  state[room][id] = Object.assign({}, getTableState(room,id), patch);
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = "";
  ROOM_ORDER.forEach(key=>{
    const r = ROOMS[key];
    const tab = document.createElement('div');
    tab.className = "tab" + (key===currentRoom?" active":"");
    tab.innerHTML = `${r.name}<span class="cap">${r.sub}</span>`;
    tab.onclick = ()=>{ currentRoom = key; render(); };
    tabsEl.appendChild(tab);
  });
}

function render(){
  buildTabs();
  const room = ROOMS[currentRoom];
  document.getElementById('roomMeta').innerHTML = `<span><b>${room.name}</b></span><span>${room.sub}</span>`;

  const planEl = document.getElementById('plan');
  planEl.style.aspectRatio = room.ratio;
  planEl.className = "plan" + (editMode ? " edit-mode" : "");
  planEl.innerHTML = "";

  room.tables.forEach(t=>{
    if(t.shape === "hub"){
      const pos = (state[currentRoom] && state[currentRoom][t.id] && state[currentRoom][t.id].pos) || {x:t.x,y:t.y};
      const hub = document.createElement('div');
      hub.className = "hub";
      hub.style.left = pos.x + "%";
      hub.style.top = pos.y + "%";
      hub.style.width = t.w + "%";
      hub.style.height = t.h + "%";
      planEl.appendChild(hub);
      return;
    }
    const st = getTableState(currentRoom, t.id);
    const pos = (state[currentRoom] && state[currentRoom][t.id] && state[currentRoom][t.id].pos) || {x:t.x,y:t.y};

    const el = document.createElement('div');
    el.className = "table " + t.shape + (st.status==="reserved" ? " reserved" : "");
    if(!NO_CHAIRS.has(t.id)) el.classList.add("has-chairs");
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.width = t.w + "%";
    el.style.height = t.h + "%";
    el.dataset.id = t.id;

    const inner = document.createElement('div');
    inner.className = t.shape === "diamond" ? "inner" : "";
    inner.style.display="flex";
    inner.style.flexDirection="column";
    inner.style.alignItems="center";
    inner.style.justifyContent="center";
    let label = t.label || t.cap;
    inner.innerHTML = `<span>${label}</span>` + (st.status==="reserved" ? `<span class="name-tag">${escapeHtml(st.name)}</span>` : "");
    el.appendChild(inner);

    el.addEventListener('click', ()=>{ /* view-only: no editing here */ });

    planEl.appendChild(el);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// (drag-to-reposition disabled in read-only view — layout is managed from admin.html)

// ---------- Init + live refresh ----------
(async function init(){
  await loadState();
  render();
  setInterval(async ()=>{
    await loadState();
    render();
  }, 4000);
