<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Plan de Salle — Réservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Space+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f3;
    --grid:#e6e1d4;
    --ink:#2a2822;
    --wall:#3a362c;
    --gold:#b8935a;
    --table-fill:#f2dfa0;
    --table-fill-hover:#ecd383;
    --table-border:#8a6d3b;
    --reserved:#b03a2e;
    --reserved-border:#7a2620;
    --paper-panel:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:20px;
    min-height:100vh;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
    border-bottom:2px solid var(--wall);
    padding-bottom:14px;
  }
  .header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:-0.5px;
  }
  .header .sub{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#8a8672;
  }
  .toolbar{display:flex;gap:10px;align-items:center;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1.5px solid var(--wall);
    background:var(--paper-panel);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:var(--wall);color:var(--paper);}
  .btn.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.danger{border-color:var(--reserved);color:var(--reserved);}
  .btn.danger:hover{background:var(--reserved);color:#fff;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.5px;
    padding:10px 18px;
    background:var(--paper-panel);
    border:1.5px solid var(--grid);
    border-bottom:none;
    cursor:pointer;
    color:#8a8672;
    position:relative;
    top:1px;
  }
  .tab.active{
    color:var(--ink);
    border-color:var(--wall);
    background:var(--paper-panel);
    font-weight:700;
  }
  .tab .cap{display:block;font-size:10px;color:#a89f7f;margin-top:2px;}

  .room-meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#8a8672;
    margin-bottom:10px;
    display:flex;
    gap:18px;
  }
  .room-meta b{color:var(--ink);}

  .plan-wrap{
    background:var(--paper-panel);
    border:1.5px solid var(--wall);
    border-radius:2px;
    position:relative;
    overflow:hidden;
    box-shadow:0 2px 0 var(--grid);
  }
  .plan{
    position:relative;
    width:100%;
    background-image:
      linear-gradient(#f0ede2 1px, transparent 1px),
      linear-gradient(90deg, #f0ede2 1px, transparent 1px);
    background-size:5% 5%;
  }
  .room-label{
    position:absolute;
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:#b0a888;
    letter-spacing:1px;
    padding:6px 8px;
    pointer-events:none;
  }

  .table{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--table-fill);
    border:1.5px solid var(--table-border);
    color:var(--ink);
    font-family:'Space Mono',monospace;
    font-size:9px;
    font-weight:700;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:background .12s, box-shadow .12s;
    line-height:1.2;
    padding:2px;
  }
  .table:hover{background:var(--table-fill-hover);}
  .table.circle{border-radius:50%;}
  .table.rect{border-radius:5px;}
  .table.diamond .inner{transform:rotate(-45deg);}
  .table.diamond{border-radius:5px;}
  .table.has-chairs.circle::before{
    content:"";position:absolute;inset:-16%;
    border:1.5px dashed var(--table-border);border-radius:50%;pointer-events:none;
  }
  .table.has-chairs.diamond::before{
    content:"";position:absolute;inset:-18%;
    border:1.5px dashed var(--table-border);border-radius:8px;pointer-events:none;
  }
  .table.has-chairs.rect::before{
    content:"";position:absolute;inset:-12% -7%;
    border:1.5px dashed var(--table-border);border-radius:9px;pointer-events:none;
  }
  .table.reserved.has-chairs::before{border-color:var(--reserved-border);}
  .hub{
    position:absolute;
    background:repeating-linear-gradient(45deg, var(--wall), var(--wall) 2px, transparent 2px, transparent 7px);
    border:1px solid var(--wall);
    transform:rotate(45deg);
    pointer-events:none;
    opacity:0.65;
  }
  .table.reserved{
    background:var(--reserved);
    border-color:var(--reserved-border);
    color:#fff;
  }
  .table.dragging{
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    z-index:50;
    opacity:0.9;
  }
  .edit-mode .table{cursor:grab;}
  .edit-mode .table.dragging{cursor:grabbing;}
  .table .name-tag{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:9px;
    margin-top:2px;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .legend{
    display:flex;gap:18px;margin-top:12px;
    font-family:'Space Mono',monospace;font-size:11px;color:#8a8672;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(30,28,22,0.55);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-panel);
    border:1.5px solid var(--wall);
    border-radius:4px;
    padding:22px 24px;
    width:300px;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
  }
  .modal h3{
    margin:0 0 4px;
    font-family:'Fraunces',serif;
    font-size:19px;
  }
  .modal .meta{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#8a8672;
    margin-bottom:14px;
  }
  .modal input{
    width:100%;
    padding:9px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    border:1.5px solid var(--grid);
    border-radius:3px;
    margin-bottom:12px;
  }
  .modal .row{display:flex;gap:8px;}
  .modal .row .btn{flex:1;text-align:center;}
  .modal .close{
    position:absolute;top:14px;right:16px;cursor:pointer;
    font-size:16px;color:#8a8672;background:none;border:none;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--wall);color:var(--paper);
    font-family:'Space Mono',monospace;font-size:12px;
    padding:10px 18px;border-radius:4px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Plan de Salle</h1>
    <div class="sub" id="loadStatus">chargement…</div>
  </div>
  <div class="toolbar">
    <button class="btn" id="editToggle">Modifier disposition</button>
    <button class="btn danger" id="resetRoom">Vider ce plan</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="room-meta" id="roomMeta"></div>

<div class="plan-wrap">
  <div class="plan" id="plan"></div>
</div>

<div class="legend">
  <span><i class="swatch" style="background:var(--table-fill);border:1px solid var(--table-border)"></i>Libre</span>
  <span><i class="swatch" style="background:var(--reserved)"></i>Réservée</span>
  <span style="margin-left:auto;">Cliquez une table pour réserver / libérer · Mode édition pour déplacer</span>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="modalClose">✕</button>
    <h3 id="modalTitle">Table</h3>
    <div class="meta" id="modalMeta"></div>
    <input id="nameInput" placeholder="Nom du client" autocomplete="off">
    <div class="row">
      <button class="btn active" id="reserveBtn">Réserver</button>
      <button class="btn danger" id="clearBtn">Libérer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

      {id:"S1-24",shape:"circle",cap:"2p",x:73,y:69,w:5,h:8},
      {id:"S1-25",shape:"rect",cap:"4-6p",x:24,y:87,w:9,h:11},

  },
  balcon: {

    tables:[
      {id:"BAL-01",shape:"circle",cap:"2p",x:34,y:5,w:6,h:12},
      {id:"BAL-02",shape:"circle",cap:"2p",x:44,y:5,w:6,h:12},

      {id:"BAL-10",shape:"circle",cap:"2p",x:30,y:45,w:6,h:12},
      {id:"BAL-11",shape:"circle",cap:"2p",x:87,y:45,w:6,h:12},
      {id:"BAL-12",shape:"circle",cap:"2p",x:30,y:83,w:6,h:12},
      {id:"BAL-13",shape:"circle",cap:"2p",x:87,y:83,w:6,h:12},
      {id:"BAL-14",shape:"rect",cap:"15p",x:41,y:70,w:37,h:16,label:"BAR PRINCIPAL (15p)"},
    ]
  }
};

const ROOM_ORDER = ["salle1","salle2","vip","balcon"];
let state = {}; // room -> {tableId: {x,y,status,name}}
let currentRoom = "salle1";
let editMode = false;
let activeTableId = null;
let dragging = null;

const STORAGE_KEY = "floorplan-state-v1";

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    state = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }
  document.getElementById('loadStatus').textContent = "données partagées — synchronisées";
}

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
  }catch(e){
    toast("Erreur de sauvegarde");
  }
}

function getTableState(room, id){
  if(!state[room]) state[room] = {};
  return state[room][id] || {status:"free", name:""};
}
function setTableState(room, id, patch){
  if(!state[room]) state[room] = {};
  state[room][id] = Object.assign({}, getTableState(room,id), patch);
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = "";
  ROOM_ORDER.forEach(key=>{
    const r = ROOMS[key];
    const tab = document.createElement('div');
    tab.className = "tab" + (key===currentRoom?" active":"");
    tab.innerHTML = `${r.name}<span class="cap">${r.sub}</span>`;
    tab.onclick = ()=>{ currentRoom = key; render(); };
    tabsEl.appendChild(tab);
  });
}

function render(){
  buildTabs();
  const room = ROOMS[currentRoom];
  document.getElementById('roomMeta').innerHTML = `<span><b>${room.name}</b></span><span>${room.sub}</span>`;

  const planEl = document.getElementById('plan');
  planEl.style.aspectRatio = room.ratio;
  planEl.className = "plan" + (editMode ? " edit-mode" : "");
  planEl.innerHTML = "";

  room.tables.forEach(t=>{
    const st = getTableState(currentRoom, t.id);
    const pos = (state[currentRoom] && state[currentRoom][t.id] && state[currentRoom][t.id].pos) || {x:t.x,y:t.y};

    const el = document.createElement('div');
    el.className = "table " + t.shape + (st.status==="reserved" ? " reserved" : "");
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    el.style.width = t.w + "%";
    el.style.height = t.h + "%";
    el.dataset.id = t.id;

    const inner = document.createElement('div');
    inner.className = t.shape === "diamond" ? "inner" : "";
    inner.style.display="flex";
    inner.style.flexDirection="column";
    inner.style.alignItems="center";
    inner.style.justifyContent="center";
    let label = t.label || t.cap;
    inner.innerHTML = `<span>${label}</span>` + (st.status==="reserved" ? `<span class="name-tag">${escapeHtml(st.name)}</span>` : "");
    el.appendChild(inner);

    el.addEventListener('pointerdown', (e)=>onPointerDown(e, el, t));
    el.addEventListener('click', (e)=>{ if(!el._didDrag) openModal(t); });

    planEl.appendChild(el);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- Drag to reposition (edit mode only) ----------
function onPointerDown(e, el, t){
  if(!editMode) return;
  e.preventDefault();
  const plan = document.getElementById('plan');
  const rect = plan.getBoundingClientRect();
  el._didDrag = false;
  el.classList.add('dragging');
  const startX = e.clientX, startY = e.clientY;

  function move(ev){
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) el._didDrag = true;
    const newLeftPx = el.offsetLeft + (el._didDrag ? dx : 0);
    // recompute relative to plan each move using percentage
    const xPct = Math.min(100 - parseFloat(el.style.width), Math.max(0, ((ev.clientX - rect.left) / rect.width * 100) - parseFloat(el.style.width)/2));
    const yPct = Math.min(100 - parseFloat(el.style.height), Math.max(0, ((ev.clientY - rect.top) / rect.height * 100) - parseFloat(el.style.height)/2));
    el.style.left = xPct + "%";
    el.style.top = yPct + "%";
    el._newPos = {x:xPct, y:yPct};
  }
  function up(){
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    if(el._didDrag && el._newPos){
      setTableState(currentRoom, t.id, {pos: el._newPos});
      saveState();
    }
    setTimeout(()=>{ el._didDrag = false; }, 0);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

// ---------- Reservation modal ----------
function openModal(t){
  if(editMode) return;
  activeTableId = t.id;
  const st = getTableState(currentRoom, t.id);
  document.getElementById('modalTitle').textContent = t.id;
  document.getElementById('modalMeta').textContent = (t.label || t.cap) + " · " + ROOMS[currentRoom].name;
  document.getElementById('nameInput').value = st.name || "";
  document.getElementById('overlay').classList.add('show');
  document.getElementById('nameInput').focus();
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  activeTableId = null;
}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };

document.getElementById('reserveBtn').onclick = ()=>{
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ toast("Entrez un nom"); return; }
  setTableState(currentRoom, activeTableId, {status:"reserved", name});
  saveState();
  render();
  closeModal();
  toast("Table réservée");
};
document.getElementById('clearBtn').onclick = ()=>{
  setTableState(currentRoom, activeTableId, {status:"free", name:""});
  saveState();
  render();
  closeModal();
  toast("Table libérée");
};

document.getElementById('editToggle').onclick = ()=>{
  editMode = !editMode;
  document.getElementById('editToggle').classList.toggle('active', editMode);
  document.getElementById('editToggle').textContent = editMode ? "Terminer l'édition" : "Modifier disposition";
  render();
};

document.getElementById('resetRoom').onclick = ()=>{
  if(!confirm("Vider toutes les réservations de " + ROOMS[currentRoom].name + " ?")) return;
  const room = state[currentRoom] || {};
  Object.keys(room).forEach(id=>{ room[id].status="free"; room[id].name=""; });
  saveState();
  render();
  toast("Plan vidé");
};

// ---------- Init ----------
(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
